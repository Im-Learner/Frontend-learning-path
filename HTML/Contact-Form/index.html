<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Form</title>
  </head>

  <body>
    <header>
      <h1>RA Support</h1>
      <nav>
        <a href="home.html">Home </a>

        <a href="help.html">Help </a>

        <a href="index.html">Contact </a>
      </nav>
    </header>
    <br />
    <hr />
    <main>
      <h2>Contact us</h2>
      <p>Send us a message and we will get back to you.</p>
      <form action="https://httpbin.org/post" method="post">
        <label for="Fullname">Full name</label>
        <input type="text" id="Fullname" name="FullName" required /><br /><br />
        <label for="Email">Email</label>
        <input type="email" id="Email" name="Email" required /><br /><br />
        <label for="Subject">Subject</label>
        <select id="Subject" name="Subject" required>
          <option value="" selected disabled>Choose your subject</option>
          <option value="General">General</option>
          <option value="Technical">Technical</option>
          <option value="Projects">Projects</option>
          <option value="Cooperation">Cooperation</option></select
        ><br /><br />
        <label for="Message">Message</label>
        <textarea
          id="Message"
          name="Message"
          rows="5"
          minlength="10"
          required
        ></textarea
        ><br /><br />
        <fieldset>
          <legend>How did you hear about us?</legend>
          <input
            type="radio"
            id="search"
            name="source"
            value="Search"
            required
          />
          <label for="search">Search</label><br />
          <input type="radio" id="friend" value="Friend" name="source" />
          <label for="friend">Friend</label><br />
          <input type="radio" id="social" value="Social media" name="source" />
          <label for="social">Social media</label>
        </fieldset>
        <br />
        <input
          type="checkbox"
          id="opportunity"
          name="opportunity"
          value="interested"
        />
        <label for="opportunity"
          >Send me cooperation and investment opportunities.</label
        ><br /><br />
        <button type="submit">Send message</button>
      </form>
      <br />
    </main>
    <hr />
    <footer>
      <p>&copy; RA Support</p>
    </footer>
  </body>
</html>
